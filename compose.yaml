# Development infrastructure only; API, web and worker run on the host.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: agentbench
      POSTGRES_PASSWORD: agentbench
      POSTGRES_DB: agentbench
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentbench -d agentbench"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
